[package]
name = "portal-mobile"
version = "0.1.0"
description = "Portal Mobile: thin client of the Portal Desktop daemon"
edition = "2021"

[lib]
name = "portal_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.10.1", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "time", "sync"] }
# No TLS anywhere: the daemon is plain HTTP/WS on the LAN.
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tokio-tungstenite = "0.21"
futures-util = "0.3"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
