# Final artifacts (the app exe, bundles) go to one target dir on a drive with
# room (D: has repeatedly run to 0 free - see docs/development/PORTAL_MOBILE.md's
# "Preconditions"), grouped under I:/build/cargo/ alongside other projects.
#
# Intermediates (deps/, incremental/, build scripts, test binaries) go to a
# build dir per workspace path, so every worktree compiles its own. Sharing
# them was not safe: cargo names a path crate's artifacts by its
# workspace-relative path and judges freshness by mtime, so `cargo test` in
# one worktree could run another worktree's portal-core test binary and still
# report "Fresh". Cost: one full build per crate dir per worktree (3-30 GB each),
# never deleted with the worktree - run `pnpm prune:build` after removing one.
#
# Per-machine paths, not portable - elsewhere or in CI, override with the
# CARGO_TARGET_DIR and CARGO_BUILD_BUILD_DIR env vars (they take precedence
# over this file) rather than editing the paths below.
[build]
target-dir = "I:/build/cargo/portal-desktop"
build-dir = "I:/build/cargo/portal-desktop/build/{workspace-path-hash}"
