[package]
name = "portal-core"
version = "0.1.0"
edition = "2021"
description = "Portal Desktop's transport-agnostic core. Must never depend on tauri."

# There is deliberately no `tauri` line here, and there must never be one. The
# whole point of phase 1 in docs/development/REMOTE_ARCHITECTURE.md is that the
# compiler — not a review convention — is what stops a service reaching for the
# webview. Adding tauri here silently gives that up.
#
# Versions are kept identical to src-tauri/Cargo.toml. A skew would compile two
# copies of a crate into one binary, and for sea-orm that means two schemas.
[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1.0"
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"
futures = "0.3"
futures-util = "0.3"
once_cell = "1.21.3"
thiserror = "1.0"
dirs = "5.0"
rand = "0.8"

# Persistence
sea-orm = { version = "1.1", features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros"] }
sea-orm-migration = { version = "1.1", features = ["sqlx-sqlite", "runtime-tokio-rustls"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite"] }
rusqlite = { version = "0.32", features = ["bundled"] }

# Network
reqwest = { version = "0.12.23", features = ["json", "stream", "blocking"] }
tokio-tungstenite = "0.21"

# Kubernetes
kube = { version = "0.87", features = ["runtime", "derive"] }
k8s-openapi = { version = "0.20", features = ["v1_28"] }

# Terminal
portable-pty = "0.9"

# Crypto / encoding
ring = "0.17"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"

# Download and archive handling
tar = "0.4"
flate2 = "1.0"
zip = "0.6"
xz2 = "0.1"

# Process and system inspection
sysinfo = "0.30"
which = "6.0"
version-compare = "0.1"

# OS keychain (Windows Credential Manager / macOS Keychain / Linux Secret Service)
# for storing the credential master key. crypto-rust avoids an OpenSSL build dep.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }

# Disk-cleanup domain
jwalk = "0.8"
trash = "5"
ts-rs = { version = "12.0.1", features = ["chrono-impl", "serde-json-impl"] }

[dev-dependencies]
tempfile = "3"
uuid = { version = "1.0", features = ["v4"] }
