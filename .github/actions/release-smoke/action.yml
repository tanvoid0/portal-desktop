name: Release smoke test
description: Fast pre-release validation before platform builds start
runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@v5

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22'

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable

    # Was missing here (unlike the matrix build jobs), so every release did a
    # fully cold cargo build just to run `cargo check`/`cargo test` once.
    - name: Rust cache
      uses: swatinem/rust-cache@v2
      with:
        workspaces: './src-tauri -> target'

    - name: Get pnpm store directory
      shell: bash
      run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

    - name: Cache pnpm store
      uses: actions/cache@v5
      with:
        path: ${{ env.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-

    - name: Install Linux system dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libwebkit2gtk-4.1-dev \
          build-essential \
          libssl-dev \
          libgtk-3-dev \
          libayatana-appindicator3-dev \
          librsvg2-dev \
          patchelf

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Build frontend
      shell: bash
      run: pnpm build

    - name: Cargo check (Tauri backend)
      shell: bash
      working-directory: src-tauri
      run: cargo check --locked

    - name: Unit tests
      shell: bash
      run: pnpm vitest run
